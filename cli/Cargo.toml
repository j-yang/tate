[package]
name = "tate-cli"
version = "0.1.0"
description = "CLI for tate — structural diff and sheaf-pushout merge for JSON, YAML, TOML, and text"
keywords = ["diff", "merge", "git", "json", "structured-data"]
categories = ["command-line-utilities", "text-processing"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tate"
path = "src/main.rs"

[dependencies]
tate = { version = "3", path = "..", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
