[package]
name = "tate"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "A version control kernel for structured data — sheaf pushout merge with referential integrity"
repository = "https://github.com/j-yang/tate"
readme = "README.md"
keywords = ["diff", "merge", "patch", "tree", "sheaf"]
categories = ["text-processing", "development-tools"]
exclude = ["paper/"]

[features]
default = ["serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"