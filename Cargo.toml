[package]
name = "tate"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "A version control kernel for structured data — diff, patch, pushout merge, and a commit DAG, built on a sheaf-section algebra"
repository = "https://github.com/j-yang/tate"
readme = "README.md"
keywords = ["diff", "merge", "patch", "tree", "sheaf"]
categories = ["text-processing", "development-tools"]

[features]
default = ["serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"