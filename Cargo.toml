[package]
name = "tate"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "Structured diff, patch algebra, and sheaf-pushout merge for tree-shaped data"
repository = "https://github.com/j-yang/tate"
readme = "README.md"
keywords = ["diff", "merge", "patch", "tree", "sheaf"]
categories = ["text-processing", "development-tools"]
exclude = ["paper/", "cli/"]

[workspace]
members = ["cli"]
resolver = "2"

[features]
default = ["serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"